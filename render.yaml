services:
  - type: web
    name: ticket-flow-control
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-flow-db
          property: connectionString

databases:
  - name: ticket-flow-db
    plan: free
